<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="apple-touch-icon" href="/Ottchanel/icon.png"> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ottchanel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  html, body { height: 100%; }

  body {
    background: #17181b;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px;
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    color: #eee;
  }

  /* リモコン本体 */
  .remote {
    width: 100%;
    max-width: 340px;
    height: min(100%, 800px);
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 18px 18px 24px;
    background:
      radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.07), transparent 60%),
      linear-gradient(170deg, #36373c 0%, #222327 55%, #19191c 100%);
    border-radius: 44px 44px 56px 56px;
    box-shadow:
      0 24px 56px rgba(0, 0, 0, 0.7),
      inset 0 2px 3px rgba(255, 255, 255, 0.14),
      inset 0 -4px 8px rgba(0, 0, 0, 0.55);
  }

  /* 赤外線窓 */
  .ir-window {
    align-self: center;
    width: 96px;
    height: 10px;
    border-radius: 6px;
    background: linear-gradient(180deg, #5a1414, #260606);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8), 0 1px 0 rgba(255, 255, 255, 0.1);
  }

  /* 送信状況の表示窓 */
  .lcd {
    min-height: 46px;
    padding: 7px 12px;
    border-radius: 10px;
    background: #a3b89d;
    color: #1d2a1b;
    font-family: "Courier New", Courier, monospace;
    font-size: 0.78rem;
    font-weight: bold;
    line-height: 1.4;
    white-space: pre-line;
    display: flex;
    align-items: center;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.45), 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .brand {
    text-align: center;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.3em;
    color: #85858c;
  }

  /* 独立ボタンエリア（2×2） */
  .direct-pad {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    padding: 8px;
    border-radius: 18px;
    background: rgba(0, 0, 0, 0.28);
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .direct-key {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 2px;
    min-height: 52px;
    padding: 7px 10px;
    border: none;
    border-radius: 13px;
    color: #fff;
    cursor: pointer;
    text-align: left;
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    transition: transform 0.08s, box-shadow 0.08s, filter 0.1s;
  }

  .direct-key:hover { filter: brightness(1.1); }
  .direct-key:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.75); }
  .direct-key.empty { opacity: 0.45; }
  .direct-key.last { outline: 2px solid #fff; outline-offset: -2px; }

  .direct-key.cat-work  { background: linear-gradient(180deg, #2d6a9f, #1e4970); }
  .direct-key.cat-sleep { background: linear-gradient(180deg, #5e4b8b, #3e3160); }
  .direct-key.cat-sport { background: linear-gradient(180deg, #c05621, #8c3b14); }
  .direct-key.cat-cam   { background: linear-gradient(180deg, #287a5e, #1a5440); }

  .direct-cat {
    font-size: 0.62rem;
    font-weight: bold;
    opacity: 0.85;
    letter-spacing: 0.04em;
  }

  .direct-name {
    max-width: calc(100% - 12px);
    font-size: 0.78rem;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* チャンネルキー */
  .keypad {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: min-content;
    gap: 10px;
    padding: 2px 3px 6px;
  }

  .key {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    min-height: 64px;
    padding: 9px 8px;
    border: none;
    border-radius: 18px;
    background: linear-gradient(180deg, #4b4c52, #333438);
    color: #f1f1f1;
    cursor: pointer;
    box-shadow: 0 4px 0 #0d0d0f, inset 0 1px 0 rgba(255, 255, 255, 0.18);
    transition: transform 0.08s, box-shadow 0.08s;
  }

  .key:hover { background: linear-gradient(180deg, #5a5b62, #3a3b40); }
  .key:active { transform: translateY(3px); box-shadow: 0 1px 0 #0d0d0f; }
  .key:focus-visible, .direct-key:focus-visible, .tool-btn:focus-visible { outline: 2px solid #4aa3ff; outline-offset: 2px; }
  .key.empty { opacity: 0.4; }
  .key.last { background: linear-gradient(180deg, #ee8a2c, #c75a12); box-shadow: 0 4px 0 #7a3608, inset 0 1px 0 rgba(255, 255, 255, 0.25); }

  .key-num {
    font-family: "Courier New", Courier, monospace;
    font-size: 1.45rem;
    font-weight: bold;
    line-height: 1;
  }

  .key-name {
    max-width: 100%;
    font-size: 0.72rem;
    font-weight: bold;
    opacity: 0.85;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* タブが開いている目印 */
  .key-dot {
    position: absolute;
    top: 8px;
    right: 10px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: transparent;
  }
  .key.is-open .key-dot, .direct-key.is-open .key-dot { background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
  .key.is-unknown .key-dot, .direct-key.is-unknown .key-dot { background: #f1c40f; box-shadow: 0 0 6px #f1c40f; }

  .tools { display: flex; gap: 6px; }
  .tool-btn {
    flex: 1;
    padding: 9px 6px;
    border: none;
    border-radius: 12px;
    background: #2a2b2f;
    color: #b0b0b7;
    font-size: 0.72rem;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    white-space: nowrap;
  }
  .tool-btn:hover { background: #36373c; color: #fff; }
  .tool-btn.shared-on {
    background: #23382c;
    color: #7ee2a8;
    box-shadow: inset 0 0 0 1px rgba(46, 204, 113, 0.35);
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 12px;
  }

  .modal-content {
    background: #2c2c2c;
    padding: 20px;
    border-radius: 12px;
    width: 100%;
    max-width: 650px;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-content h2 { margin-bottom: 12px; font-size: 1.05rem; border-bottom: 1px solid #555; padding-bottom: 6px; }
  .modal-section-title {
    margin: 14px 0 8px;
    font-size: 0.88rem;
    color: #9fd3ff;
    font-weight: bold;
  }

  .setting-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
  .setting-row span { width: 42px; font-weight: bold; flex-shrink: 0; font-size: 0.85rem; }
  .setting-row span.cat-badge {
    width: auto;
    min-width: 112px;
    padding: 3px 7px;
    border-radius: 4px;
    background: #3d3d42;
    font-size: 0.76rem;
    color: #ddd;
  }
  .setting-row input {
    background: #1a1a1a;
    border: 1px solid #555;
    color: #fff;
    padding: 6px 10px;
    border-radius: 4px;
    user-select: text;
  }
  .setting-row input.name-input { flex: 1; min-width: 120px; }
  .setting-row input.url-input { flex-basis: 100%; }

  .del-btn { padding: 6px 10px; border: none; border-radius: 4px; background: #5a3a3a; color: #fff; font-size: 0.8rem; cursor: pointer; }
  .del-btn:hover:not(:disabled) { background: #a04040; }
  .del-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .add-btn { width: 100%; margin-top: 4px; padding: 9px; border: 1px dashed #777; border-radius: 6px; background: transparent; color: #ccc; font-size: 0.9rem; cursor: pointer; }
  .add-btn:hover { background: #383838; color: #fff; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .modal-actions button { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
  .save-btn { background: #27ae60; color: #fff; }
  .reset-btn { background: #c0392b; color: #fff; margin-right: auto; }
  .cancel-btn { background: #7f8c8d; color: #fff; }

  /* 横持ち（スマホなど高さの低い横長画面）:
     左に操作部、右にチャンネルボタンを4列で表示。縦持ちには影響しません */
  @media (orientation: landscape) and (max-height: 540px) {
    html, body { height: auto; min-height: 100%; }
    body { align-items: flex-start; padding: 6px; }

    .remote {
      max-width: 100%;
      height: calc(100vh - 12px);
      height: calc(100dvh - 12px);
      min-height: 230px;
      display: grid;
      grid-template-columns: 250px 1fr;
      grid-template-rows: auto auto auto auto 1fr;
      grid-template-areas:
        "lcd    keypad"
        "brand  keypad"
        "direct keypad"
        "tools  keypad"
        ".      keypad";
      gap: 8px 12px;
      padding: 10px 14px;
      border-radius: 28px;
    }

    .ir-window { display: none; }
    .lcd { grid-area: lcd; min-height: 36px; padding: 5px 10px; font-size: 0.72rem; }
    .brand { grid-area: brand; }
    .direct-pad { grid-area: direct; padding: 6px; gap: 6px; border-radius: 14px; }
    .direct-key { min-height: 44px; padding: 5px 8px; }
    .tools { grid-area: tools; }
    .tool-btn { padding: 7px 4px; }

    .keypad {
      grid-area: keypad;
      grid-template-columns: repeat(4, 1fr);
      align-content: start;
      gap: 8px;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .key { min-height: 54px; padding: 6px 4px; border-radius: 14px; }
    .key-num { font-size: 1.2rem; }
    .key-name { font-size: 0.66rem; }
  }

</style>
</head>
<body>

<div class="remote">
  <div class="ir-window"></div>
  <div id="lcd" class="lcd">ボタンを押すとチャンネルが開きます</div>
  <div class="brand">OTTCHANEL</div>

  <!-- 2×2 独立カテゴリボタン -->
  <div id="directPad" class="direct-pad"></div>

  <!-- 通常チャンネルキー -->
  <div id="keypad" class="keypad"></div>

  <div class="tools">
    <button id="modeBtn" class="tool-btn shared-on" title="視聴タブの開き方を切り替え">1タブ共有</button>
    <button id="launchBtn" class="tool-btn">新ウィンドウ</button>
    <button id="openSettingsBtn" class="tool-btn">⚙ 設定</button>
  </div>
</div>

<div id="settingsModal" class="modal-overlay">
  <div class="modal-content">
    <h2>リモコン設定（独立ボタン・チャンネルの編集）</h2>

    <div class="modal-section-title">■ 独立ボタン（2×2 カテゴリ別ショートカット）</div>
    <div id="directSettingsForm"></div>

    <div class="modal-section-title">■ チャンネルボタン（1CH〜）</div>
    <div id="settingsForm"></div>
    <button type="button" id="addChannelBtn" class="add-btn">＋ チャンネルを追加</button>

    <div class="modal-actions">
      <button id="resetBtn" class="reset-btn">初期値に戻す</button>
      <button id="cancelSettingsBtn" class="cancel-btn">キャンセル</button>
      <button id="saveSettingsBtn" class="save-btn">保存して適用</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = "webTvChannels";
  const DIRECT_STORAGE_KEY = "webTvDirectButtons";
  const MODE_STORAGE_KEY = "webTvSingleTabMode";
  const SHARED_WINDOW_NAME = "webremote_shared_viewer";
  const DEFAULT_LCD = "ボタンを押すとチャンネルが開きます";

  const DEFAULT_DIRECT_BUTTONS = [
    {
      id: "d_work",
      category: "仕事・集中BGM",
      cssClass: "cat-work",
      name: "環境音ミックス",
      url: "https://asoftmurmur.com/"
    },
    {
      id: "d_sleep",
      category: "睡眠・リラックス",
      cssClass: "cat-sleep",
      name: "雨音リラックス",
      url: "https://rainymood.com/"
    },
    {
      id: "d_sport",
      category: "運動・気分転換",
      cssClass: "cat-sport",
      name: "Radio Garden",
      url: "https://radio.garden/"
    },
    {
      id: "d_cam",
      category: "定点カメラ・風景",
      cssClass: "cat-cam",
      name: "EarthCam ライブ",
      url: "https://www.earthcam.com/"
    }
  ];

  const DEFAULT_CHANNELS = [
     { id: "c1", name: "YouTube", url: "https://www.youtube.com/" },
 　　{ id: "c2", name: "Amazon Prime Video", url: "https://www.amazon.co.jp/gp/video/storefront" },
　　 { id: "c3", name: "Netflix", url: "https://www.netflix.com/browse" },
　　 { id: "c4", name: "TVer", url: "https://tver.jp/" },
　　 { id: "c5", name: "NHKプラス", url: "https://plus.nhk.jp/" },
　　 { id: "c6", name: "ABEMA", url: "https://abema.tv/" },
 　　{ id: "c7", name: "ニコニコ動画", url: "https://www.nicovideo.jp/" },
　　 { id: "c8", name: "radiko (ラジコ)", url: "https://radiko.jp/" },
　　 { id: "c9", name: "らじる★らじる", url: "https://www.nhk.or.jp/radio/" },
　　 { id: "c10", name: "Spotify Web", url: "https://open.spotify.com/" }
  ];

  function cleanUrl(value) {
    let v = String(value || "").trim();
    if (!v) return "";
    if (!/^[a-z][a-z0-9+.-]*:/i.test(v)) v = "https://" + v;
    try {
      const u = new URL(v);
      return u.protocol === "http:" || u.protocol === "https:" ? u.href : "";
    } catch (_) {
      return "";
    }
  }

  function newId() {
    return "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  }

  function normalizeChannels(list) {
    const seen = new Set();
    return list.map((c, i) => {
      let id = String(c.id || "c" + (c.ch || i + 1)).replace(/[^\w-]/g, "");
      if (!id || seen.has(id)) id = newId();
      seen.add(id);
      return { id, name: c.name || `${i + 1}CH`, url: cleanUrl(c.url) };
    });
  }

  function loadSingleTabMode() {
    const saved = localStorage.getItem(MODE_STORAGE_KEY);
    return saved === null ? true : saved === "true";
  }

  function loadDirectButtons() {
    try {
      const saved = JSON.parse(localStorage.getItem(DIRECT_STORAGE_KEY));
      if (Array.isArray(saved) && saved.length === DEFAULT_DIRECT_BUTTONS.length) {
        return DEFAULT_DIRECT_BUTTONS.map((def, idx) => ({
          id: def.id,
          category: def.category,
          cssClass: def.cssClass,
          name: (saved[idx] && saved[idx].name) ? String(saved[idx].name) : def.name,
          url: saved[idx] && "url" in saved[idx] ? cleanUrl(saved[idx].url) : def.url
        }));
      }
    } catch (_) {}
    return DEFAULT_DIRECT_BUTTONS.map((d) => ({ ...d }));
  }

  function loadChannels() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(saved) && saved.length) return normalizeChannels(saved);
    } catch (_) {}
    return normalizeChannels(DEFAULT_CHANNELS);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }

  let isSingleTabMode = loadSingleTabMode();
  let directButtons = loadDirectButtons();
  let channels = loadChannels();
  let currentId = null;
  let sharedTab = { w: null, activeId: null, at: 0, severed: false };
  const openedTabs = {};

  const directPad = document.getElementById("directPad");
  const keypad = document.getElementById("keypad");
  const lcd = document.getElementById("lcd");
  const modeBtn = document.getElementById("modeBtn");
  const settingsModal = document.getElementById("settingsModal");
  const directSettingsForm = document.getElementById("directSettingsForm");
  const settingsForm = document.getElementById("settingsForm");

  function setLcd(text) { lcd.textContent = text; }

  function syncModeButton() {
    modeBtn.textContent = isSingleTabMode ? "1タブ共有" : "個別タブ";
    modeBtn.classList.toggle("shared-on", isSingleTabMode);
  }

  function isSharedTabAlive() {
    if (!sharedTab.w) return false;
    if (!sharedTab.w.closed) return true;
    if (sharedTab.severed) return true;
    if (Date.now() - sharedTab.at < 10000) {
      sharedTab.severed = true;
      return true;
    }
    return false;
  }

  function tabState(id) {
    if (isSingleTabMode) {
      if (sharedTab.activeId === id && isSharedTabAlive()) {
        return sharedTab.severed ? "unknown" : "open";
      }
      return "none";
    }
    const o = openedTabs[id];
    if (!o) return "none";
    if (!o.w.closed) return "open";
    if (o.severed) return "unknown";
    if (Date.now() - o.at < 10000) { o.severed = true; return "unknown"; }
    return "none";
  }

  function applyLamp(btn, id) {
    const s = tabState(id);
    btn.classList.toggle("is-open", s === "open");
    btn.classList.toggle("is-unknown", s === "unknown");
  }

  function openInSharedTab(id, label, url) {
    const isSameAlive = sharedTab.activeId === id && isSharedTabAlive() && !sharedTab.severed;
    if (isSameAlive) {
      try {
        sharedTab.w.focus();
        setLcd(`${label}\n共有タブを表示中`);
        renderAllKeys();
        return;
      } catch (_) {}
    }

    let w = null;
    try {
      w = window.open(url, SHARED_WINDOW_NAME);
    } catch (_) {}

    if (!w) {
      setLcd("ポップアップがブロックされました\n許可してください");
      renderAllKeys();
      return;
    }

    const isSwitch = sharedTab.activeId !== null && sharedTab.activeId !== id && isSharedTabAlive();
    sharedTab = {
      w,
      activeId: id,
      at: Date.now(),
      severed: false
    };
    try { w.focus(); } catch (_) {}
    setLcd(isSwitch ? `${label}\n共有タブを切り替えました` : `${label}\n共有タブで開きました`);
    renderAllKeys();
  }

  function openInIndividualTab(id, label, url) {
    const prev = tabState(id);
    const existing = openedTabs[id];

    if (existing && existing.w && !existing.w.closed && !existing.severed) {
      try {
        existing.w.focus();
        setLcd(`${label}\n開いているタブに移動`);
        renderAllKeys();
        return;
      } catch (_) {}
    }

    let w = null;
    try {
      w = window.open(url, "webremote_" + id);
    } catch (_) {}

    if (!w) {
      setLcd("ポップアップがブロックされました\n許可してください");
      renderAllKeys();
      return;
    }

    openedTabs[id] = { w, at: Date.now(), severed: false };
    try { w.focus(); } catch (_) {}
    setLcd(prev === "unknown"
      ? `${label}\n新しいタブで開きました\n(前のタブは確認できません)`
      : `${label}\n別タブで開きました`);
    renderAllKeys();
  }

  function openTargetTab(id, label, url) {
    currentId = id;
    if (!url) {
      setLcd(`${label}\nURLが未設定です`);
      renderAllKeys();
      return;
    }
    if (isSingleTabMode) {
      openInSharedTab(id, label, url);
    } else {
      openInIndividualTab(id, label, url);
    }
  }

  modeBtn.onclick = () => {
    isSingleTabMode = !isSingleTabMode;
    localStorage.setItem(MODE_STORAGE_KEY, String(isSingleTabMode));
    syncModeButton();
    renderAllKeys();
    setLcd(isSingleTabMode
      ? "1タブ共有モードに切替\n視聴タブを1つにまとめます"
      : "個別タブモードに切替\nチャンネルごとにタブを分けます");
  };

  function renderDirectKeys() {
    directPad.innerHTML = "";
    directButtons.forEach((item) => {
      const btn = document.createElement("button");
      btn.className = `direct-key ${item.cssClass}`
        + (item.id === currentId ? " last" : "")
        + (item.url ? "" : " empty");
      btn.title = item.url ? `${item.category}: ${item.name}` : `${item.category}: URL未設定`;
      btn.innerHTML = `
        <span class="key-dot"></span>
        <span class="direct-cat">${escapeHtml(item.category)}</span>
        <span class="direct-name">${escapeHtml(item.name)}</span>
      `;
      btn.onclick = () => openTargetTab(item.id, `[${item.category}] ${item.name}`, item.url);
      applyLamp(btn, item.id);
      directPad.appendChild(btn);
    });
  }

  function renderKeys() {
    keypad.innerHTML = "";
    channels.forEach((item, index) => {
      const btn = document.createElement("button");
      btn.className = "key"
        + (item.id === currentId ? " last" : "")
        + (item.url ? "" : " empty");
      btn.title = item.url ? item.name : "URLが未設定です";
      btn.innerHTML = `
        <span class="key-dot"></span>
        <span class="key-num">${index + 1}</span>
        <span class="key-name">${escapeHtml(item.name)}</span>
      `;
      btn.onclick = () => openChannel(index);
      applyLamp(btn, item.id);
      keypad.appendChild(btn);
    });
  }

  function renderAllKeys() {
    renderDirectKeys();
    renderKeys();
  }

  function refreshOnResume() {
    syncModeButton();
    renderAllKeys();
    requestAnimationFrame(() => {
      const remoteEl = document.querySelector(".remote");
      if (remoteEl) {
        void remoteEl.offsetHeight;
      }
      renderAllKeys();
    });
  }

  window.addEventListener("pageshow", refreshOnResume);
  window.addEventListener("focus", refreshOnResume);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      refreshOnResume();
    }
  });

  function openChannel(index) {
    const item = channels[index];
    openTargetTab(item.id, `${index + 1}CH ${item.name}`, item.url);
  }

  window.addEventListener("keydown", (e) => {
    if (settingsModal.style.display === "flex") return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key >= "1" && e.key <= "9" && parseInt(e.key, 10) <= channels.length) {
      openChannel(parseInt(e.key, 10) - 1);
    }
  });

  setInterval(() => {
    directPad.querySelectorAll(".direct-key").forEach((btn, i) => {
      if (directButtons[i]) applyLamp(btn, directButtons[i].id);
    });
    keypad.querySelectorAll(".key").forEach((btn, i) => {
      if (channels[i]) applyLamp(btn, channels[i].id);
    });
  }, 1500);

  document.getElementById("launchBtn").onclick = () => {
    const a = document.createElement("a");
    a.href = location.href;
    a.target = "_blank";
    a.rel = "noopener";
    document.body.appendChild(a);
    a.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, shiftKey: true }));
    a.remove();
    setLcd("新しいウィンドウで開きます\n開いた先で操作してください");
  };

  // ---- 設定画面 ----
  let directDraft = [];
  let draft = [];

  function readDraft() {
    directSettingsForm.querySelectorAll(".setting-row").forEach((row, i) => {
      if (!directDraft[i]) return;
      directDraft[i].name = row.querySelector(".name-input").value;
      directDraft[i].url = row.querySelector(".url-input").value;
    });
    settingsForm.querySelectorAll(".setting-row").forEach((row, i) => {
      if (!draft[i]) return;
      draft[i].name = row.querySelector(".name-input").value;
      draft[i].url = row.querySelector(".url-input").value;
    });
  }

  function renderSettings() {
    directSettingsForm.innerHTML = "";
    directDraft.forEach((item) => {
      const row = document.createElement("div");
      row.className = "setting-row";
      row.innerHTML = `
        <span class="cat-badge">${escapeHtml(item.category)}</span>
        <input type="text" class="name-input" value="${escapeHtml(item.name)}" placeholder="ボタン表示名">
        <input type="text" class="url-input" value="${escapeHtml(item.url)}" placeholder="https://...">
      `;
      directSettingsForm.appendChild(row);
    });

    settingsForm.innerHTML = "";
    draft.forEach((item, idx) => {
      const row = document.createElement("div");
      row.className = "setting-row";
      row.innerHTML = `
        <span>${idx + 1}CH</span>
        <input type="text" class="name-input" value="${escapeHtml(item.name)}" placeholder="チャンネル名">
        <button type="button" class="del-btn" title="このチャンネルを削除"${draft.length <= 1 ? " disabled" : ""}>削除</button>
        <input type="text" class="url-input" value="${escapeHtml(item.url)}" placeholder="https://...">
      `;
      row.querySelector(".del-btn").onclick = () => {
        readDraft();
        draft.splice(idx, 1);
        renderSettings();
      };
      settingsForm.appendChild(row);
    });
  }

  document.getElementById("openSettingsBtn").onclick = () => {
    directDraft = directButtons.map((d) => ({ ...d }));
    draft = channels.map((c) => ({ ...c }));
    renderSettings();
    settingsModal.style.display = "flex";
  };

  document.getElementById("addChannelBtn").onclick = () => {
    readDraft();
    draft.push({ id: newId(), name: "", url: "" });
    renderSettings();
    const inputs = settingsForm.querySelectorAll(".name-input");
    const last = inputs[inputs.length - 1];
    last.focus();
    last.scrollIntoView({ block: "nearest" });
  };

  document.getElementById("cancelSettingsBtn").onclick = () => settingsModal.style.display = "none";

  document.getElementById("saveSettingsBtn").onclick = () => {
    readDraft();
    const nextDirect = directDraft.map((d, idx) => ({
      ...DEFAULT_DIRECT_BUTTONS[idx],
      name: d.name.trim() || DEFAULT_DIRECT_BUTTONS[idx].name,
      url: cleanUrl(d.url)
    }));

    const next = draft
      .filter((c) => c.name.trim() || c.url.trim())
      .map((c, i) => ({ id: c.id, name: c.name.trim() || `${i + 1}CH`, url: cleanUrl(c.url) }));
    if (!next.length) {
      alert("チャンネルが1つもありません。1つ以上入力してください。");
      return;
    }

    directButtons = nextDirect;
    channels = next;
    localStorage.setItem(DIRECT_STORAGE_KEY, JSON.stringify(directButtons));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(channels));
    settingsModal.style.display = "none";
    renderAllKeys();
  };

  document.getElementById("resetBtn").onclick = () => {
    if (confirm("独立ボタンとチャンネル設定をすべて初期状態に戻しますか？")) {
      directButtons = DEFAULT_DIRECT_BUTTONS.map((d) => ({ ...d }));
      channels = normalizeChannels(DEFAULT_CHANNELS);
      localStorage.removeItem(DIRECT_STORAGE_KEY);
      localStorage.removeItem(STORAGE_KEY);
      currentId = null;
      settingsModal.style.display = "none";
      setLcd(DEFAULT_LCD);
      renderAllKeys();
    }
  };

  syncModeButton();
  renderAllKeys();
</script>
</body>
</html>
